<div class="modal-backdrop" id="modalBackdrop"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><h2 id="modalTitle">REX settings</h2><p>Shape how REX responds. These preferences stay in this browser.</p><label for="modeSelect">Default focus</label><select id="modeSelect"><option value="General">General</option><option value="Learn">Learn</option><option value="Research">Research</option><option value="Code">Code</option><option value="Creative">Creative</option></select><label for="styleSelect">Response style</label><select id="styleSelect"><option value="Balanced">Balanced</option><option value="Concise">Concise</option><option value="Detailed">Detailed</option></select><label for="voiceSelect">REX voice</label><select id="voiceSelect"><option value="">System default voice</option></select><label for="speechRate">Speaking speed <span id="rateLabel" style="color:var(--muted);font-weight:400">1.0×</span></label><input id="speechRate" type="range" min="0.75" max="1.25" step="0.05" value="1" style="width:100%;accent-color:var(--accent)"><label style="display:flex;align-items:center;gap:9px;margin:12px 0"><input id="autoSpeak" type="checkbox" style="width:auto;accent-color:var(--accent)"> Automatically read new REX replies aloud</label><label for="memoryInput">Optional preferences for REX</label><input id="memoryInput" placeholder="e.g. Explain things simply; use examples"><div class="modal-actions"><button class="secondary" id="clearMemory">Clear preferences</button><button class="secondary" id="closeSettings">Cancel</button><button class="primary" id="saveSettings">Save settings</button></div></section></div><div class="toast" id="toast"></div>
<script>
const $=id=>document.getElementById(id),STORE='rex_chats_v2',PREF='rex_prefs_v1';let selectedVoice='',speechRate=1,autoSpeak=false;let chats=[];try{chats=JSON.parse(localStorage.getItem(STORE)||localStorage.getItem('rex_chats_v1')||'[]');if(!Array.isArray(chats))chats=[]}catch{}let current=chats[0]?.id||null,busy=false,controller=null,attachments=[],searchMode=false,focusMode='General',responseStyle='Balanced',preferences='',recognition=null,toastTimer,liveMode=false,awaitingResponse=false,liveRestartTimer=null;
const readPrefs=()=>{try{const p=JSON.parse(localStorage.getItem(PREF)||'{}');focusMode=p.focusMode||'General';responseStyle=p.responseStyle||'Balanced';preferences=p.preferences||'';selectedVoice=p.selectedVoice||'';speechRate=Number(p.speechRate)||1;autoSpeak=!!p.autoSpeak;if(p.dark)document.body.classList.add('dark')}catch{}};readPrefs();const savePrefs=()=>localStorage.setItem(PREF,JSON.stringify({focusMode,responseStyle,preferences,selectedVoice,speechRate,autoSpeak,dark:document.body.classList.contains('dark')}));const save=()=>{try{localStorage.setItem(STORE,JSON.stringify(chats))}catch{toast('Browser storage is full; export chats to keep a copy.')}};const active=()=>chats.find(c=>c.id===current);function toast(s){const t=$('toast');t.textContent=s;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2300)}function closeMenu(){$('sidebar').classList.remove('open');$('overlay').classList.remove('open')}function newChat(){if(busy)return;current=null;attachments=[];render();renderAttachments();closeMenu();$('prompt').focus()}function escapeHTML(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function renderMarkdown(text){if(window.marked){marked.setOptions({gfm:true,breaks:true});return marked.parse(text)}return '<p>'+escapeHTML(text).replace(/\n/g,'<br>')+'</p>'}function renderHistory(){const q=$('historySearch').value.toLowerCase();$('history').replaceChildren();for(const c of chats.filter(x=>x.title.toLowerCase().includes(q))){const row=document.createElement('div');row.className='history-item'+(c.id===current?' active':'');const b=document.createElement('button');b.className='open-chat';b.textContent=(c.pinned?'📌 ':'')+c.title;b.title=c.title;b.onclick=()=>{if(busy)return;current=c.id;render();closeMenu()};const menu=document.createElement('button');menu.className='chat-menu';menu.textContent='···';menu.title='Conversation options';menu.onclick=()=>{const action=prompt('Type: rename, pin, export, or delete');if(!action)return;const a=action.toLowerCase().trim();if(a==='rename'){const n=prompt('New conversation name',c.title);if(n?.trim())c.title=n.trim().slice(0,80)}else if(a==='pin')c.pinned=!c.pinned;else if(a==='delete'){if(confirm('Delete this conversation?')){chats=chats.filter(x=>x.id!==c.id);if(current===c.id)current=chats[0]?.id||null}}else if(a==='export'){downloadJSON(c,'rex-conversation.json');return}else{toast('Choose rename, pin, export or delete');return}save();render()};row.append(b,menu);$('history').append(row)}}function renderWelcome(t){const w=document.createElement('div');w.className='welcome';w.innerHTML='<div class="eyebrow">A little curiosity goes a long way</div><h1>Where shall we <em>begin?</em></h1><p>Big ideas, small questions, and everything in between.<br>Think freely. Create boldly. Make something remarkable.</p><div class="quick-label">A FEW PLACES TO START</div><div class="suggestions"></div><div class="modes" aria-label="Choose a focus"></div>';const prompts=[['✧','Help me shape a new idea','Help me develop an original idea. Ask a useful question if needed, then give me a clear plan.'],['◇','Explain something fascinating','Teach me a fascinating concept in a clear, engaging way, with an example.'],['↗','Let’s build something together','Help me plan and build a polished project step by step.']];for(const [sym,label,promptText] of prompts){const b=document.createElement('button');b.innerHTML='<span class="symbol">'+sym+'</span><span class="label">'+label+'</span><span class="arrow">↗</span>';b.onclick=()=>{$('prompt').value=promptText;$('prompt').focus()};w.querySelector('.suggestions').append(b)}for(const m of ['General','Learn','Research','Code','Creative']){const b=document.createElement('button');b.className='mode'+(focusMode===m?' active':'');b.textContent=m;b.onclick=()=>{focusMode=m;savePrefs();w.querySelectorAll('.mode').forEach(x=>x.classList.toggle('active',x.textContent===m));toast(m+' mode selected')};w.querySelector('.modes').append(b)}t.append(w)}function addMessage(parent,role,content,opts={}){const el=document.createElement('article');el.className='message '+role;if(role==='assistant'){const who=document.createElement('div');who.className='who';const img=document.createElement('img');img.src='logo.jpg';img.onerror=()=>{img.onerror=()=>img.remove();img.src='logo.jpeg'};img.alt='';who.append(img,document.createTextNode('REX'));el.append(who)}const body=document.createElement('div');body.className=role==='assistant'?'message-body':'message-text';if(role==='assistant'&&opts.thinking){body.innerHTML='<div class="thinking"><span class="dots"><i></i><i></i><i></i></span> REX is thinking</div>'}else if(role==='assistant'){body.innerHTML=renderMarkdown(content||'');body.querySelectorAll('pre code').forEach(el=>{if(window.hljs)hljs.highlightElement(el)});body.querySelectorAll('a').forEach(a=>{a.target='_blank';a.rel='noopener noreferrer'});body.querySelectorAll('pre').forEach(pre=>{const b=document.createElement('button');b.className='tool-btn';b.textContent='Copy code';b.style.cssText='position:absolute;right:8px;top:8px;background:#343530;color:#eee';b.onclick=()=>copy(pre.querySelector('code')?.innerText||pre.innerText);pre.append(b)})}else{body.textContent=content}el.append(body);if(role==='assistant'&&!opts.thinking){const actions=document.createElement('div');actions.className='message-actions';for(const [label,fn] of [['Copy',()=>copy(content)],['Read aloud',()=>speak(content)],['Regenerate',()=>regenerate()],['Export',()=>downloadText(content,'rex-response.md')]]){const b=document.createElement('button');b.textContent=label;b.onclick=fn;actions.append(b)}el.append(actions)}parent.append(el);return {el,body}}function render(){renderHistory();const t=$('thread');t.replaceChildren();const c=active();if(!c||!c.messages.length)renderWelcome(t);else for(const m of c.messages){addMessage(t,m.role,m.content);if(m.files?.length&&m.role==='user'){const last=t.lastElementChild;const note=document.createElement('div');note.style.cssText='color:var(--muted);font-size:11px;margin-top:7px';note.textContent='Attachments: '+m.files.join(', ');last.append(note)}}$('messages').scrollTop=$('messages').scrollHeight}function scrollBottom(){$('messages').scrollTop=$('messages').scrollHeight}function copy(text){navigator.clipboard?.writeText(text).then(()=>toast('Copied to clipboard')).catch(()=>toast('Copy unavailable in this browser'))}function downloadText(text,name){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/markdown'}));a.download=name;a.click();URL.revokeObjectURL(a.href)}function downloadJSON(obj,name){downloadText(JSON.stringify(obj,null,2),name)}function exportCurrent(){const c=active();if(!c)return toast('There is no active conversation to export');downloadJSON(c,'rex-'+c.title.toLowerCase().replace(/[^a-z0-9]+/g,'-').slice(0,35)+'.json')}function exportAll(){downloadJSON(chats,'rex-all-conversations.json')}function renderAttachments(){$('attachPreview').replaceChildren();for(let i=0;i<attachments.length;i++){const f=attachments[i],chip=document.createElement('div');chip.className='file-chip';if(f.mime?.startsWith('image/')){const img=document.createElement('img');img.src=f.dataUrl;chip.append(img)}const name=document.createElement('span');name.textContent=f.name;const remove=document.createElement('button');remove.textContent='×';remove.title='Remove attachment';remove.onclick=()=>{attachments.splice(i,1);renderAttachments()};chip.append(name,remove);$('attachPreview').append(chip)}}async function handleFiles(files){for(const file of files){if(attachments.length>=4){toast('Attach up to 4 files per message');break}if(file.size>8*1024*1024){toast(file.name+' is over the 8 MB limit');continue}try{if(file.type.startsWith('image/')){const dataUrl=await readData(file);attachments.push({name:file.name,mime:file.type,dataUrl,base64:dataUrl.split(',')[1]})}else if(file.type==='application/pdf'||file.name.toLowerCase().endsWith('.pdf')){if(!window.pdfjsLib)throw Error('PDF reader did not load');pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';const buf=await file.arrayBuffer(),pdf=await pdfjsLib.getDocument({data:buf}).promise;let txt='';for(let p=1;p<=Math.min(pdf.numPages,35);p++){const page=await pdf.getPage(p),content=await page.getTextContent();txt+=content.items.map(x=>x.str).join(' ')+'\n'}attachments.push({name:file.name,mime:'text/plain',text:'[PDF '+file.name+']\n'+txt.slice(0,45000)})}else{const text=await file.text();attachments.push({name:file.name,mime:'text/plain',text:'[File '+file.name+']\n'+text.slice(0,30000)})}}catch(e){toast('Could not read '+file.name+': '+e.message)}}renderAttachments()}function readData(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)})}function getPayloadMessages(c){return c.messages.slice(-24).map(m=>({role:m.role,content:m.content,attachments:m.attachments||[]}))}async function send(e){e?.preventDefault();if(busy)return;const text=$('prompt').value.trim();if(!text&&!attachments.length)return;let outgoing=text||'Please inspect the attached file(s) and explain what you find.';if(!active()){current=(crypto.randomUUID?.()||String(Date.now()));chats.unshift({id:current,title:(text||attachments[0]?.name||'New conversation').slice(0,48),messages:[],pinned:false})}const c=active();const fileNames=attachments.map(f=>f.name);const attachPayload=attachments.map(f=>f.mime?.startsWith('image/')?{name:f.name,mime:f.mime,base64:f.base64}:{name:f.name,mime:'text/plain',text:f.text||''});c.messages.push({role:'user',content:outgoing,files:fileNames,attachments:attachPayload});$('prompt').value='';$('prompt').style.height='auto';attachments=[];renderAttachments();save();render();busy=true;if(liveMode){awaitingResponse=true;setVoiceState('REX is thinking…')}controller=new AbortController();$('send').textContent='■';$('send').classList.add('stop');$('send').title='Stop generating';$('send').disabled=false;const thinking=addMessage($('thread'),'assistant','',{thinking:true});scrollBottom();try{const response=await fetch('/.netlify/functions/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:getPayloadMessages(c),mode:focusMode,responseStyle,preferences,webSearch:searchMode}),signal:controller.signal});const data=await response.json();if(!response.ok)throw Error(data.error||'Request failed');thinking.body.innerHTML=renderMarkdown(data.reply||'No response received.');thinking.body.querySelectorAll('pre code').forEach(el=>{if(window.hljs)hljs.highlightElement(el)});thinking.body.querySelectorAll('a').forEach(a=>{a.target='_blank';a.rel='noopener noreferrer'});thinking.body.querySelectorAll('pre').forEach(pre=>{const b=document.createElement('button');b.className='tool-btn';b.textContent='Copy code';b.style.cssText='position:absolute;right:8px;top:8px;background:#343530;color:#eee';b.onclick=()=>copy(pre.querySelector('code')?.innerText||pre.innerText);pre.append(b)});const answer=data.reply||'No response received.';c.messages.push({role:'assistant',content:answer});save();if(autoSpeak||liveMode)speak(answer,{resumeLive:liveMode});const actions=document.createElement('div');actions.className='message-actions';for(const [label,fn] of [['Copy',()=>copy(answer)],['Read aloud',()=>speak(answer)],['Regenerate',()=>regenerate()],['Export',()=>downloadText(answer,'rex-response.md')]]){const b=document.createElement('button');b.textContent=label;b.onclick=fn;actions.append(b)}thinking.el.append(actions);if(data.sources?.length){const sources=document.createElement('div');sources.className='message-actions';sources.style.flexWrap='wrap';const label=document.createElement('span');label.textContent='Sources: ';sources.append(label);for(const s of data.sources.slice(0,6)){const a=document.createElement('a');a.href=s.uri;a.target='_blank';a.rel='noopener noreferrer';a.textContent=s.title||s.uri;a.style.cssText='font-size:11px;color:var(--accent);margin-right:8px';sources.append(a)}thinking.el.append(sources)} }catch(err){if(err.name==='AbortError'){thinking.body.textContent='Generation stopped.'}else{thinking.body.textContent='I couldn’t respond just now. '+err.message;const b=document.createElement('button');b.className='message-actions';b.textContent='Try again';b.onclick=()=>regenerate();thinking.el.append(b);if(liveMode){awaitingResponse=false;setVoiceState('Listening — try speaking again')}}}finally{busy=false;controller=null;$('send').textContent='↑';$('send').classList.remove('stop');$('send').title='Send message';save();renderHistory();scrollBottom()}}function stop(){if(controller)controller.abort()}function regenerate(){if(busy)return;const c=active();if(!c)return;let lastUser=-1;for(let i=c.messages.length-1;i>=0;i--)if(c.messages[i].role==='user'){lastUser=i;break}if(lastUser<0)return;const previous=c.messages[lastUser];c.messages=c.messages.slice(0,lastUser);attachments=(previous.attachments||[]).map(f=>f.base64?{...f,dataUrl:'data:'+f.mime+';base64,'+f.base64}:f);$('prompt').value=previous.content||'';renderAttachments();save();render();send()}function openSettings(){ $('modeSelect').value=focusMode;$('styleSelect').value=responseStyle;$('memoryInput').value=preferences;populateVoices();$('voiceSelect').value=selectedVoice;$('speechRate').value=speechRate;$('rateLabel').textContent=Number(speechRate).toFixed(2).replace(/0$/,'')+'×';$('autoSpeak').checked=autoSpeak;$('modalBackdrop').classList.add('open')}function closeSettings(){$('modalBackdrop').classList.remove('open')}function recognitionCtor(){return window.SpeechRecognition||window.webkitSpeechRecognition}
function setVoiceState(text,show=true){$('voiceStateText').textContent=text;$('voiceState').classList.toggle('show',show)}
function startLiveListening(){const SR=recognitionCtor();if(!liveMode||busy||awaitingResponse||recognition||!SR)return;try{const rec=new SR();recognition=rec;rec.lang=navigator.language||'en-US';rec.interimResults=true;rec.continuous=false;let finalText='';rec.onresult=e=>{let interim='';for(let i=e.resultIndex;i<e.results.length;i++){const r=e.results[i];if(r.isFinal)finalText+=r[0].transcript+' ';else interim+=r[0].transcript}if(interim)$('prompt').placeholder=interim; if(finalText.trim()){const spoken=finalText.trim();$('prompt').value=spoken;awaitingResponse=true;setVoiceState('REX is thinking…');setTimeout(()=>{if(recognition===rec)try{rec.stop()}catch{};if($('prompt').value.trim()&&!busy)$('form').requestSubmit()},180)}};rec.onerror=e=>{if(e.error!=='aborted'&&e.error!=='no-speech')toast('Microphone access was not available');};rec.onend=()=>{if(recognition===rec)recognition=null;$('prompt').placeholder='Ask anything, or simply start thinking…';if(liveMode&&!awaitingResponse&&!busy){clearTimeout(liveRestartTimer);liveRestartTimer=setTimeout(startLiveListening,350)}};rec.start();setVoiceState('Listening — speak naturally');$('liveBtn').classList.add('active')}catch(e){toast('Could not start microphone. Check browser permissions.');liveMode=false;$('liveBtn').classList.remove('active');setVoiceState('',false)}}
function toggleLive(){if(liveMode){liveMode=false;awaitingResponse=false;clearTimeout(liveRestartTimer);if(recognition){try{recognition.onend=null;recognition.stop()}catch{}recognition=null}if('speechSynthesis'in window)speechSynthesis.cancel();$('liveBtn').classList.remove('active');setVoiceState('',false);toast('Live voice ended');return}const SR=recognitionCtor();if(!SR)return toast('Live voice needs Chrome or another browser with speech recognition support');liveMode=true;awaitingResponse=false;$('liveBtn').classList.add('active');startLiveListening();toast('Live voice is on. Speak after the listening indicator appears.')}
function voice(){const SR=recognitionCtor();if(!SR)return toast('Voice input is not supported in this browser');if(recognition){try{recognition.stop()}catch{}recognition=null;$('voiceBtn').classList.remove('active');return}recognition=new SR();const rec=recognition;rec.lang=navigator.language||'en-US';rec.interimResults=true;rec.onresult=e=>{let val='';for(let i=e.resultIndex;i<e.results.length;i++)val+=e.results[i][0].transcript;$('prompt').value=val};rec.onend=()=>{if(recognition===rec)recognition=null;$('voiceBtn').classList.remove('active')};rec.onerror=()=>toast('Microphone access was not available');try{rec.start();$('voiceBtn').classList.add('active');toast('Listening… tap Dictate to stop')}catch{recognition=null;toast('Could not start microphone')}}
function populateVoices(){if(!('speechSynthesis'in window))return;const select=$('voiceSelect'),voices=speechSynthesis.getVoices();const keep=select.value||selectedVoice;select.replaceChildren(new Option('Auto / system default',''));voices.forEach(v=>{const opt=new Option(v.name+' · '+v.lang,v.voiceURI);select.append(opt)});if([...select.options].some(o=>o.value===keep))select.value=keep}
if('speechSynthesis'in window){populateVoices();speechSynthesis.onvoiceschanged=populateVoices}
function speak(text,options={}){if(!('speechSynthesis'in window))return toast('Read aloud is not supported in this browser');if(speechSynthesis.speaking&&!options.force){speechSynthesis.cancel();if(!options.resumeLive)toast('Voice stopped');return}const clean=String(text).replace(/```[\s\S]*?```/g,' Code block omitted. ').replace(/!\[.*?\]\(.*?\)/g,' image ').replace(/\[(.*?)\]\(.*?\)/g,'$1').replace(/[#>*_`~|]/g,' ').replace(/\s+/g,' ').trim();const utterance=new SpeechSynthesisUtterance(clean);utterance.rate=speechRate||1;const voices=speechSynthesis.getVoices();const langMatch=(clean.match(/[\u0900-\u097F]/)?'hi':clean.match(/[\u3040-\u30ff\u4e00-\u9fff]/)?'ja':clean.match(/[áéíóúñ¿¡]/i)?'es':(navigator.language||'en').split('-')[0]);utterance.voice=voices.find(v=>v.voiceURI===selectedVoice)||voices.find(v=>v.lang.toLowerCase().startsWith(langMatch))||voices.find(v=>v.lang===navigator.language)||null;utterance.onstart=()=>{if(options.resumeLive)setVoiceState('REX is speaking…');else toast('REX is speaking… tap Read aloud again to stop')};utterance.onend=()=>{if(options.resumeLive&&liveMode){awaitingResponse=false;setVoiceState('Listening — your turn');startLiveListening()}};utterance.onerror=e=>{if(e.error!=='canceled'){toast('Could not play this voice');if(options.resumeLive&&liveMode){awaitingResponse=false;startLiveListening()}}};speechSynthesis.speak(utterance)}
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.shiftKey&&e.key.toLowerCase()==='v'){e.preventDefault();toggleLive()}});window.addEventListener('beforeunload',()=>{if(recognition)try{recognition.stop()}catch{};if('speechSynthesis'in window)speechSynthesis.cancel()});$('form').addEventListener('submit',e=>{if(busy){e.preventDefault();stop()}else send(e)});$('prompt').addEventListener('input',()=>{$('prompt').style.height='auto';$('prompt').style.height=Math.min($('prompt').scrollHeight,180)+'px'});$('prompt').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();if(busy)stop();else $('form').requestSubmit()}});$('new').onclick=newChat;$('menu').onclick=()=>{$('sidebar').classList.add('open');$('overlay').classList.add('open')};$('overlay').onclick=closeMenu;$('historySearch').oninput=renderHistory;$('exportCurrent').onclick=exportCurrent;$('exportAll').onclick=exportAll;$('settingsBtn').onclick=openSettings;$('settingsTop').onclick=openSettings;$('closeSettings').onclick=closeSettings;$('modalBackdrop').onclick=e=>{if(e.target===$('modalBackdrop'))closeSettings()};$('saveSettings').onclick=()=>{focusMode=$('modeSelect').value;responseStyle=$('styleSelect').value;preferences=$('memoryInput').value.trim().slice(0,800);selectedVoice=$('voiceSelect').value;speechRate=Number($('speechRate').value)||1;autoSpeak=$('autoSpeak').checked;savePrefs();closeSettings();render();toast('Preferences saved')};$('clearMemory').onclick=()=>{$('memoryInput').value='';preferences='';savePrefs();toast('Preferences cleared')};$('speechRate').oninput=()=>{$('rateLabel').textContent=Number($('speechRate').value).toFixed(2).replace(/0$/,'')+'×'};$('themeBtn').onclick=()=>{document.body.classList.toggle('dark');savePrefs();$('themeBtn').textContent=document.body.classList.contains('dark')?'☀':'☾'};$('attachBtn').onclick=()=>$('fileInput').click();$('fileInput').onchange=async e=>{await handleFiles([...e.target.files]);e.target.value=''};$('webBtn').onclick=()=>{searchMode=!searchMode;$('webBtn').classList.toggle('active',searchMode);toast(searchMode?'Web search enabled for next messages':'Web search disabled')};$('voiceBtn').onclick=voice;$('liveBtn').onclick=toggleLive;readPrefs();$('themeBtn').textContent=document.body.classList.contains('dark')?'☀':'☾';render();const hideIntro=()=>{$('intro').classList.add('hide')};$('skipIntro').onclick=hideIntro;setTimeout(hideIntro,2300);
</script></body></html>
